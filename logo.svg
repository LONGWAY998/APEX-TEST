<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#C8963E"/>
      <stop offset="100%" style="stop-color:#8B6914"/>
    </linearGradient>
  </defs>

  <!-- Shield / Hexagon shape -->
  <polygon points="100,12 176,50 176,110 100,188 24,110 24,50"
           fill="none" stroke="url(#gold)" stroke-width="6" stroke-linejoin="round"/>

  <!-- Inner geometric mark - stylized mountain/arrow representing growth & stability -->
  <polyline points="56,130 100,60 144,130"
            fill="none" stroke="url(#gold)" stroke-width="5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- Horizontal stability bar -->
  <line x1="76" y1="170" x2="124" y2="170"
        stroke="url(#gold)" stroke-width="4" stroke-linecap="round"/>
</svg>
